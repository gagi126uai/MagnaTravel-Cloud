server {
    listen 80;
    server_name _;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Obra "Restaurar TOTAL" hardening (2026-07-28, hallazgo de infra: "600s es MENOR que el timeout del
    # pg_restore de 15 min, y el comentario decia 'alineado' siendo falso" + "acotar el timeout largo a esta
    # ruta en vez de todo /api/"): location MAS ESPECIFICO que "/api/" de arriba (nginx matchea el prefijo mas
    # largo) - SOLO el endpoint de restauracion necesita un timeout largo, el resto de la API sigue con el
    # default de nginx (60s), que es lo correcto para pedidos normales (un pedido colgado 15+ minutos en CASI
    # cualquier otro endpoint es un bug, no algo a tolerar).
    #
    # Numero real (no adivinado): peor caso ANTES de que el propio backend responda algo = chequeo de esquema
    # (Wipe__SchemaCheckTimeoutMinutes=3) + backup previo -- pg_dump (Wipe__PgDumpTimeoutMinutes=10) + copia de
    # MinIO (Wipe__MinioCopyTimeoutMinutes=5) + pg_restore (Wipe__PgRestoreTotalTimeoutMinutes=15) = 33 minutos,
    # + margen operativo (forzado de AFIP, reposicion de archivos, auditoria, overhead de red) = 2700s (45 min).
    # Estos 4 numeros son las MISMAS variables de entorno que docker-compose.yml fija para el servicio "api" —
    # si se cambian ahi, hay que revisar este comentario y este valor tambien.
    #
    # IMPORTANTE (verificado en PROD, hallazgo de infra): este archivo es el nginx que corre DENTRO del
    # contenedor "web" del propio docker-compose. En produccion hay OTRO nginx corriendo en el HOST (Ubuntu,
    # nginx 1.24.0, fuera de este repo) haciendo de reverse-proxy hacia el contenedor "web" - ESE nginx tiene
    # su propio default de 60s y corta ANTES que todo lo de aca abajo. Antes de usar la restauracion TOTAL en
    # produccion, hay que configurar el MISMO proxy_read_timeout/proxy_send_timeout en el location del
    # backoffice de ese nginx del host (ver el paso obligatorio en docs/db-operations.md, incluye el comando
    # exacto para verificarlo: `nginx -T | grep -A5 proxy_read_timeout`).
    location /api/admin/danger/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 2700s;
        proxy_send_timeout 2700s;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hangfire/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /hangfire {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /embed/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors ${EMBED_ALLOWED_FRAME_ANCESTORS}; frame-src 'self' blob: data:; object-src 'none'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; script-src 'self' https:; connect-src 'self' https: ws: wss:;" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; frame-src 'self' blob: data:; object-src 'none'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; script-src 'self' https:; connect-src 'self' https: ws: wss:;" always;
        add_header X-Frame-Options "DENY" always;
    }
}
