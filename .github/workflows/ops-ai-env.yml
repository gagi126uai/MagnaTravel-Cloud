name: Ops - Cargar clave IA en el VPS

# ============================================================================
# QUE ES ESTO
# ----------------------------------------------------------------------------
# Deposita/actualiza las variables del cerebro IA (Tarifario Inteligente,
# ADR-016) en el .env del VPS, leyendo la clave del SECRETO de GitHub
# AI_API_KEY. La clave jamas aparece en logs (GitHub la enmascara) ni en el
# repo. Despues levanta api y worker para que tomen el valor nuevo.
#
# QUIEN LO DISPARA: solo manual (workflow_dispatch / gh workflow run).
# Idempotente: correrlo dos veces deja el mismo resultado.
#
# SEGURIDAD
#   - La clave viaja del secreto de GitHub directo al .env del VPS via SSH.
#   - El script solo imprime largo y prefijo (4 chars) para verificar, nunca
#     el valor. No usa printenv ni cat .env.
#   - "docker compose up -d api worker" recrea SOLO esos servicios si su
#     configuracion cambio (segundos de corte; las sesiones sobreviven).
# ============================================================================

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-ai-env
  cancel-in-progress: false

jobs:
  cargar:
    name: Cargar variables IA en el VPS
    runs-on: ubuntu-latest
    steps:
      - name: Depositar clave y levantar servicios
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 10m
          # La clave entra como env del step (enmascarada por GitHub) y se
          # reenvia al VPS via envs:, nunca interpolada en el script.
          envs: AI_API_KEY_VALUE
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PROJECT_DIR }}"
            if [ -z "${AI_API_KEY_VALUE:-}" ]; then
              echo "ERROR: el secreto AI_API_KEY esta vacio en GitHub"; exit 1
            fi
            # Upsert idempotente de cada variable en .env (sin imprimir valores)
            upsert() {
              local clave="$1" valor="$2"
              if grep -q "^${clave}=" .env 2>/dev/null; then
                # sed con delimitador | por si el valor tiene /
                sed -i "s|^${clave}=.*|${clave}=${valor}|" .env
              else
                printf '%s=%s\n' "${clave}" "${valor}" >> .env
              fi
            }
            upsert AI_API_KEY "${AI_API_KEY_VALUE}"
            upsert AI_BASEURL "https://api.groq.com/openai/v1"
            upsert AI_MODEL "llama-3.3-70b-versatile"
            echo "Variables IA en .env: $(grep -c '^AI_' .env) (esperadas: 3)"
            echo "Clave cargada: largo $(printf %s "${AI_API_KEY_VALUE}" | wc -c), prefijo $(printf %s "${AI_API_KEY_VALUE}" | cut -c1-4)***"
            # Recrear solo api y worker si su config cambio (toman el env nuevo)
            docker compose up -d api worker
            echo "Esperando salud de api..."
            for i in $(seq 1 30); do
              if docker inspect --format '{{.State.Health.Status}}' travel_api 2>/dev/null | grep -q healthy; then
                echo "api saludable"; break
              fi
              sleep 5
              if [ "$i" = "30" ]; then echo "AVISO: api no reporto healthy en 150s — revisar logs"; fi
            done
            echo "== Listo =="
        env:
          AI_API_KEY_VALUE: ${{ secrets.AI_API_KEY }}
